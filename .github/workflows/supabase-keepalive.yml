# Production Supabase keep-alive / health check.
# Free plan projects with low database activity over 7 days may be paused.
# A read-only REST GET (anon + RLS, published practices only) keeps the
# project active; a non-2xx response fails the job so GitHub notifies us.
# Only a publishable key or legacy anon key is accepted -- never
# service_role / secret.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Production Supabase (read-only)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_PROD_ANON_KEY is not set."
            exit 1
          fi

          case "$SUPABASE_KEY" in
            sb_publishable_*) ;;
            sb_*)
              echo "::error::Only a publishable key or legacy anon key is allowed."
              exit 1
              ;;
            *)
              payload=$(printf '%s' "$SUPABASE_KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.role // empty' 2>/dev/null || true)
              if [ "$role" != "anon" ]; then
                echo "::error::Only a publishable key or legacy anon key is allowed."
                exit 1
              fi
              ;;
          esac

          curl --fail --silent --show-error --retry 3 --max-time 20 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            -H "apikey: $SUPABASE_KEY" \
            "https://qhyfpabyqksuwjzshjtu.supabase.co/rest/v1/practices?select=id&limit=1"
