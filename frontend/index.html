<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / App Icon. The icon files in public/icons/ are generated from
         the master in docs/brand/app-icon/ (MASTER_FILE in
         scripts/generate-app-icons.mjs) by that script; replacing the icon
         only means re-running it, these tags stay the same. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="apple-mobile-web-app-title" content="JOTI Yoga" />
    <title>JOTI Kundalini ABC Yoga</title>
    <meta
      name="description"
      content="JOTI 昆達里尼瑜伽線上教學平台——喚醒內在力量，從回到自己開始。提供清楚、完整的線上課程與練習，陪你從第一次接觸開始。"
    />

    <!-- Open Graph / social sharing. og:image and og:url are intentionally
         root-relative, not absolute -- JOTI's final production domain is
         not yet decided (see docs/development/project-status.md, Final
         Website Domain), so an absolute URL here would mean guessing one.
         Most real-world crawlers (Facebook, LINE) resolve a relative
         og:image against the page's own URL correctly; revisit once the
         domain is final. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JOTI Kundalini ABC Yoga" />
    <meta property="og:title" content="JOTI Kundalini ABC Yoga" />
    <meta
      property="og:description"
      content="JOTI 昆達里尼瑜伽線上教學平台——喚醒內在力量，從回到自己開始。提供清楚、完整的線上課程與練習，陪你從第一次接觸開始。"
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="zh_TW" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JOTI Kundalini ABC Yoga" />
    <meta
      name="twitter:description"
      content="JOTI 昆達里尼瑜伽線上教學平台——喚醒內在力量，從回到自己開始。提供清楚、完整的線上課程與練習，陪你從第一次接觸開始。"
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
